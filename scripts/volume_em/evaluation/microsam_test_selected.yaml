# The one test run of the micro-sam setting selected on the validation blocks, see microsam_sweep_val.yaml
# and RESULTS_microsam_sweep_val.md. Only approach A has a setting above the F1 floor of 0.05: z at the
# native 25 nm and xy at the native 5 nm, i.e. no resampling, only the tiled 1024 px canvas. The grid was
# extended to 3.75 nm to check that 5 nm is not just its edge. Writes microsam-z25-xy5-xy/ under
# /mnt/lustre-grete/usr/u15205/volume-em/repro-comparison, which compare_models.py then scores with '-s'.
#
# Submit with the runner of the synapse repo:
#   python /mnt/vast-nhr/home/freckmann15/u15205/synapse/sbatch_runner.py \
#       scripts/volume_em/evaluation/microsam_test_selected.yaml [--dry-run]

slurm_profile: grete_shared

slurm:
  job_name: "volem-microsam-test"
  time: "02:00:00"

env:
  type: micromamba
  path: /mnt/lustre-grete/usr/u15205/envs/micro-sam

commands:
  - "CUDA_VISIBLE_DEVICES=0 python /mnt/vast-nhr/home/freckmann15/u15205/synapse-net/scripts/volume_em/evaluation/segment_microsam.py
     --voxel_size 25 5 5"
